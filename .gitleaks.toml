title = "Portfolio Secrets Prevention"

[allowlist]
description = "Known safe patterns"
paths = [
  "node_modules",
  ".git",
  ".gitleaks.toml",
  "pre-commit-hook"
]

[[rules]]
id = "server-ip-address"
description = "Hardcoded IP address (likely a server)"
regex = '''\b(?:(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\b'''
tags = ["ip", "network"]
exclude = [
  "127\\.0\\.0\\.1",
  "0\\.0\\.0\\.0",
  "192\\.168\\.",
  "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}",
  "172\\.(1[6-9]|2[0-9]|3[01])\\."
]

[[rules]]
id = "forbidden-file-all-projects-context"
description = "ALL_PROJECTS_CONTEXT.md should not be tracked"
regex = '''ALL_PROJECTS_CONTEXT\.md'''
tags = ["forbidden-file"]

[[rules]]
id = "forbidden-file-docx"
description = "docx files should not be tracked"
regex = '''\.docx$'''
tags = ["forbidden-file"]

[[rules]]
id = "generic-api-key"
description = "Potential API key or token"
regex = '''(?i)(?:api[_-]?key|api[_-]?secret|secret[_-]?key|access[_-]?key|private[_-]?key|sk-[a-zA-Z0-9]{10,}|ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|xox[bpasr]-[a-zA-Z0-9]{10,}|AKIA[0-9A-Z]{16})'''
tags = ["credential", "token"]

[[rules]]
id = "connection-string"
description = "Database connection string with credentials"
regex = '''(?:postgresql|mysql|mongodb(?:\+srv)?|redis|redshift)://[^\s:]+:[^\s@]+@'''
tags = ["credential", "database"]
